<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insignia Inmo - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--color-fondo-claro); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card-proptech p-5">
                    <div class="text-center mb-4">
                        <div class="feature-icon mb-3">🏢</div>
                        <h2 class="fw-bold text-dark">Insignia Inmo</h2>
                        <p class="text-muted">Crea tu cuenta</p>
                    </div>
                    
                    <form id="registroForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control rounded-pill" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control rounded-pill" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control rounded-pill" id="password" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control rounded-pill" id="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn btn-nav active w-100 rounded-pill fw-bold py-2">Crear Cuenta</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-0">¿Ya tienes cuenta? 
                            <a href="login.html" class="text-decoration-none">Inicia sesión aquí</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nombre, email, password})
                });
                const data = await response.json();
                if (response.ok) {
                    let mensaje = '¡Cuenta creada exitosamente!\\n\\nTus 3 primeras recomendaciones:\\n';
                    if (data.recomendaciones && data.recomendaciones.length > 0) {
                        data.recomendaciones.slice(0, 3).forEach((inmueble, index) => {
                            mensaje += `${index + 1}. ${inmueble.tipo} - $${inmueble.precio}M en ${inmueble.direccion}\\n`;
                        });
                    }
                    alert(mensaje);
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Error al crear la cuenta');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        });
    </script>
</body>
</html>
