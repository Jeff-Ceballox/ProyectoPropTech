<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insignia Inmo - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--color-fondo-claro);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--color-secundario);
            margin: 0 auto 20px;
            border: 2px solid var(--color-primario);
        }
        .avatar-upload {
            position: relative;
            display: inline-block;
        }
        .avatar-upload input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body style="background-color: var(--color-fondo-claro); min-height: 100vh;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card-proptech p-5">
                    <h2 class="text-center mb-4 fw-bold">Mi Perfil</h2>
                    
                    <div class="text-center mb-4">
                        <div class="avatar-upload">
                            <div class="avatar-placeholder" id="avatarPreview">👤</div>
                            <input type="file" id="fotoInput" accept="image/*">
                        </div>
                    </div>
                    
                    <form id="perfilForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre completo</label>
                            <input type="text" class="form-control rounded-pill" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control rounded-pill" id="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="tel" class="form-control rounded-pill" id="telefono">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección</label>
                            <input type="text" class="form-control rounded-pill" id="direccion">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Intereses</label>
                            <textarea class="form-control rounded-3" id="intereses" rows="2" placeholder="Ej: Apartamento en zona norte, 2-3 habitaciones"></textarea>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-nav active rounded-pill fw-bold py-2" id="btn-guardar">Guardar cambios</button>
                            <button type="button" class="btn btn-outline-danger rounded-pill fw-bold py-2" id="logoutBtn">Cerrar sesión</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (!usuario.email) {
            window.location.href = 'landing.html';
        }

        let modoVolver = false;

        function cargarPerfil() {
            document.getElementById('email').value = usuario.email;
            document.getElementById('nombre').value = usuario.nombre || '';
            document.getElementById('telefono').value = usuario.telefono || '';
            document.getElementById('direccion').value = usuario.direccion || '';
            document.getElementById('intereses').value = usuario.intereses || '';

            if (usuario.fotoPerfil) {
                document.getElementById('avatarPreview').innerHTML =
                    `<img src="${usuario.fotoPerfil}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
            }
        }

        function actualizarLocalStorage(data) {
            if (data.nombre) usuario.nombre = data.nombre;
            if (data.nuevoEmail) usuario.email = data.nuevoEmail;
            if (data.telefono) usuario.telefono = data.telefono;
            if (data.direccion) usuario.direccion = data.direccion;
            if (data.intereses !== undefined) usuario.intereses = data.intereses;
            if (data.fotoPerfil) usuario.fotoPerfil = data.fotoPerfil;
            localStorage.setItem('usuario', JSON.stringify(usuario));
        }

        cargarPerfil();

        document.getElementById('perfilForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fotoInput = document.getElementById('fotoInput');
            let fotoBase64 = usuario.fotoPerfil || '';
            if (fotoInput.files[0]) {
                fotoBase64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => resolve(ev.target.result);
                    reader.readAsDataURL(fotoInput.files[0]);
                });
            }

            const datos = {
                email: usuario.email,
                nuevoEmail: document.getElementById('email').value,
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                intereses: document.getElementById('intereses').value,
                fotoPerfil: fotoBase64
            };

            try {
                const response = await fetch('/api/usuario/actualizar', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(datos)
                });
                const result = await response.json();
                if (response.ok) {
                    actualizarLocalStorage(datos);
                    const btn = document.getElementById('btn-guardar');
                    btn.textContent = 'Volver a inmuebles';
                    btn.classList.remove('btn-nav', 'active');
                    btn.classList.add('btn-custom');
                    modoVolver = true;
                    alert(result.mensaje || 'Perfil actualizado');
                } else {
                    alert(result.error || 'Error al actualizar perfil');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        });

        document.getElementById('btn-guardar').addEventListener('click', function(e) {
            if (modoVolver) {
                e.preventDefault();
                window.location.href = 'index.html';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('usuario');
            window.location.href = 'landing.html';
        });

        document.getElementById('fotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').innerHTML =
                        `<img src="${e.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
