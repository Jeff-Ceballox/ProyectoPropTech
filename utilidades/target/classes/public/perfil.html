<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insignia Inmo - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .profile-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            margin-top: 50px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: none;
        }
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #6c757d;
            margin: 0 auto 20px;
        }
        .avatar-upload {
            position: relative;
            display: inline-block;
        }
        .avatar-upload input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="profile-card">
                    <h2 class="text-center mb-4">Mi Perfil</h2>
                    
                    <div class="text-center">
                        <div class="avatar-upload">
                            <div class="avatar-placeholder" id="avatarPreview">👤</div>
                            <input type="file" id="fotoInput" accept="image/*">
                        </div>
                    </div>
                    
                    <form id="perfilForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email (no editable)</label>
                            <input type="email" class="form-control" id="email" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="direccion">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Intereses</label>
                            <textarea class="form-control" id="intereses" rows="2" placeholder="Ej: Apartamento en zona norte, 2-3 habitaciones"></textarea>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Guardar cambios</button>
                            <button type="button" class="btn btn-outline-danger" id="logoutBtn">Cerrar sesión</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (!usuario.email) {
            window.location.href = 'landing.html';
        }

        document.getElementById('email').value = usuario.email;
        document.getElementById('nombre').value = usuario.nombre || '';
        document.getElementById('telefono').value = usuario.telefono || '';
        document.getElementById('direccion').value = usuario.direccion || '';
        document.getElementById('intereses').value = usuario.intereses || '';

        document.getElementById('perfilForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const datos = {
                email: usuario.email,
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                intereses: document.getElementById('intereses').value
            };
            
            try {
                const response = await fetch('/api/usuario/actualizar', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(datos)
                });
                
                if (response.ok) {
                    alert('Perfil actualizado correctamente');
                    usuario.nombre = datos.nombre;
                    localStorage.setItem('usuario', JSON.stringify(usuario));
                } else {
                    alert('Error al actualizar perfil');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('usuario');
            window.location.href = 'landing.html';
        });

        document.getElementById('fotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').innerHTML = 
                        `<img src="${e.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
