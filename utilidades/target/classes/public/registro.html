<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insignia Inmo - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--color-fondo-claro); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card-proptech p-5">
                    <div class="text-center mb-4">
                        <div class="feature-icon mb-3">🏢</div>
                        <h2 class="fw-bold text-dark">Insignia Inmo</h2>
                        <p class="text-muted">Crea tu cuenta</p>
                    </div>
                    
                    <form id="registroForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control rounded-pill" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control rounded-pill" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control rounded-pill" id="password" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control rounded-pill" id="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn btn-nav active w-100 rounded-pill fw-bold py-2">Crear Cuenta</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-0">¿Ya tienes cuenta? 
                            <a href="login.html" class="text-decoration-none">Inicia sesión aquí</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function notificar(mensaje, tipo) {
            const toast = document.createElement('div');
            toast.className = 'position-fixed bottom-0 end-0 p-3';
            toast.style.zIndex = '1055';
            const bg = tipo === 'error' ? 'text-bg-danger' : 'text-bg-success';
            toast.innerHTML = `
                <div class="toast show align-items-center ${bg} border-0" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">${mensaje}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.parentElement.parentElement.parentElement.remove()"></button>
                    </div>
                </div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                notificar('Las contraseñas no coinciden', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nombre, email, password})
                });
                const data = await response.json();
                if (response.ok) {
                    let mensaje = '¡Cuenta creada exitosamente!';
                    if (data.recomendaciones && data.recomendaciones.length > 0) {
                        mensaje += '<br><br><strong>Tus 3 primeras recomendaciones:</strong><br>';
                        data.recomendaciones.slice(0, 3).forEach((inmueble, index) => {
                            mensaje += `${index + 1}. ${inmueble.tipo} - $${inmueble.precio}M en ${inmueble.direccion}<br>`;
                        });
                    }
                    notificar(mensaje, 'exito');
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                } else {
                    notificar(data.error || 'Error al crear la cuenta', 'error');
                }
            } catch (error) {
                notificar('Error de conexión', 'error');
            }
        });
    </script>
</body>
</html>
