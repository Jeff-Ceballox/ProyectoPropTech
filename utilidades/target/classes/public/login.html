<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insignia Inmo - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--color-fondo-claro); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card-proptech p-5">
                    <div class="text-center mb-4">
                        <div class="feature-icon mb-3">🏢</div>
                        <h2 class="fw-bold text-dark">Insignia Inmo</h2>
                        <p class="text-muted">Inicia sesión en tu cuenta</p>
                    </div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control rounded-pill" id="email" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control rounded-pill" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-nav active w-100 rounded-pill fw-bold py-2">Iniciar Sesión</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-0">¿No tienes cuenta? 
                            <a href="registro.html" class="text-decoration-none">Regístrate aquí</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await response.json();
                if (response.ok) {
                    const usuario = {email: email, nombre: data.nombre, rol: data.rol};
                    localStorage.setItem('usuario', JSON.stringify(usuario));
                    alert('¡Login exitoso! Bienvenido ' + data.nombre);
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Error en el login');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        });
    </script>
</body>
</html>
